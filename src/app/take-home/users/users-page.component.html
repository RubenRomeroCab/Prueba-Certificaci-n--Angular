

  <div>
    <article class="card">
      <span class="eyebrow">Estado inicial</span>
      <div class="list-heading">
        <h2>Usuarios</h2>
        <span class="pill">{{ total() }} registros</span>
      </div>

   <form class="user-form">
  <h3>Nuevo usuario</h3>
<form class="user-form" (submit)="onSubmit($event)">
  <div class="form-field">
    <label for="user-name">Nombre de usuario</label>
    <input
      id="user-name"
      type="text"
      autocomplete="name"
      [formField]="userForm.name"
    />
  </div>

  <div class="form-field">
    <label for="user-email">Email del usuario</label>
    <input
      id="user-email"
      type="email"
      autocomplete="email"
      [formField]="userForm.email"
    />
  </div>

  <div class="form-field">
    <label for="user-role">Rol del usuario</label>
    <select id="user-role" [formField]="userForm.role">
      <option value="Admin">Admin</option>
      <option value="Editor">Editor</option>
      <option value="Viewer">Viewer</option>
    </select>
  </div>

  <div class="form-actions">
    <button type="submit">Guardar usuario</button>
  </div>
</form>


      <ul>
        @for (user of users(); track user.id) {
          <li>
            <div class="user-details">
              <strong>{{ user.name }}</strong>
              <span>{{ user.email }}</span>
            </div>
            <span class="pill">{{ user.role }}</span>
          </li>
        }
      </ul>
